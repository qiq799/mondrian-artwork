<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Artwork</title>
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <main>
    <h1>Lines, Colors & Light</h1>
    <p class="intro">Inspired by Piet Mondrian</p>

    <div class="painting" aria-label="A composition of colored rectangles and black lines">
      <div class="block white-top"></div>
      <div class="block red"></div>

      <button class="block blue" aria-label="Light up the blue block"></button>

      <div class="block gray"></div>
      <div class="block white-middle"></div>
      <div class="block white-bottom"></div>
      <div class="block black"></div>
      <div class="block yellow"></div>

      <div class="line vertical"></div>
      <div class="line horizontal-top"></div>
      <div class="line horizontal-middle"></div>
      <div class="line horizontal-bottom"></div>
    </div>
    <p class="credit">
      Based on Composition with Red, Blue, Black, Yellow, and Gray, 1921.
    </p>
  </main>
</body>
</html>
